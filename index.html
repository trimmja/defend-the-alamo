<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#3a2a1a" />
  <meta name="apple-mobile-web-app-title" content="Defend the Alamo" />
  <title>Defend the Alamo</title>

  <!-- Home-screen / PWA icons -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a120b;
      overflow: hidden;
      height: 100%;
      width: 100%;
      /* prevent iOS tap highlight / text selection during play */
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <!-- Phaser 3 via CDN: no build step, deploys straight to GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
